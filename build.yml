name: Build Executable

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias y PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --onefile --windowed --name="generar_wireguard" generar_wireguard.py

    - name: Subir el ejecutable como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WireGuard-Generator-Windows
        path: dist/*.exe